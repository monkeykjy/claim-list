services:
  claimlist:
    image: claimlist:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${CLAIMLIST_BIND_IP:-0.0.0.0}:${CLAIMLIST_PORT:-1234}:1234"
    environment:
      # Use the address users enter in their browser (container IP is different).
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:1234}"
      DATABASE_PATH: /data/claim-list.sqlite
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
    volumes:
      - type: bind
        source: ${CLAIMLIST_DATA_DIR:-./data}
        target: /data
